name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release
    runs-on: macos-15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Import Code-Signing Certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # Create paths
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # Decode certificate
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH

          # Create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Import certificate
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" \
            -A -t cert -f pkcs12 -k $KEYCHAIN_PATH

          # Allow codesign to access keychain
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Set as default keychain
          security list-keychain -d user -s $KEYCHAIN_PATH

      - name: Install Provisioning Profiles
        env:
          APP_PROFILE_BASE64: ${{ secrets.APP_PROVISIONING_PROFILE_BASE64 }}
          WIDGET_PROFILE_BASE64: ${{ secrets.WIDGET_PROVISIONING_PROFILE_BASE64 }}
        run: |
          # Create profiles directory
          PROFILES_DIR=~/Library/MobileDevice/Provisioning\ Profiles
          mkdir -p "$PROFILES_DIR"

          # Decode app profile, extract UUID, and rename
          echo -n "$APP_PROFILE_BASE64" | base64 --decode -o /tmp/app.mobileprovision
          APP_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< $(/usr/bin/security cms -D -i /tmp/app.mobileprovision))
          cp /tmp/app.mobileprovision "$PROFILES_DIR/$APP_UUID.mobileprovision"
          echo "Installed app profile with UUID: $APP_UUID"

          # Decode widget profile, extract UUID, and rename
          echo -n "$WIDGET_PROFILE_BASE64" | base64 --decode -o /tmp/widget.mobileprovision
          WIDGET_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< $(/usr/bin/security cms -D -i /tmp/widget.mobileprovision))
          cp /tmp/widget.mobileprovision "$PROFILES_DIR/$WIDGET_UUID.mobileprovision"
          echo "Installed widget profile with UUID: $WIDGET_UUID"

          # List installed profiles
          ls -la "$PROFILES_DIR"

      - name: Archive App
        run: |
          xcodebuild archive \
            -scheme SP500Index \
            -configuration Release \
            -archivePath $RUNNER_TEMP/SP500Index.xcarchive \
            -destination "generic/platform=macOS" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE="Manual" \
            ENABLE_HARDENED_RUNTIME=YES \
            OTHER_CODE_SIGN_FLAGS="--options=runtime"

      - name: Export Signed App
        run: |
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/SP500Index.xcarchive \
            -exportPath $RUNNER_TEMP/export \
            -exportOptionsPlist ExportOptions.plist

      - name: Verify Code Signature
        run: |
          codesign --verify --strict --verbose=2 "$RUNNER_TEMP/export/SP500Index.app"

          if [ -d "$RUNNER_TEMP/export/SP500Index.app/Contents/Frameworks/Sparkle.framework" ]; then
            codesign --verify --strict --verbose=2 \
              "$RUNNER_TEMP/export/SP500Index.app/Contents/Frameworks/Sparkle.framework"

            find "$RUNNER_TEMP/export/SP500Index.app/Contents/Frameworks/Sparkle.framework/Versions/B/XPCServices" \
              -mindepth 1 -maxdepth 1 -type d -print0 | while IFS= read -r -d '' xpc_service; do
                codesign --verify --strict --verbose=2 "$xpc_service"
              done
          fi

      - name: Notarize App
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          # Create ZIP for notarization
          ditto -c -k --keepParent \
            "$RUNNER_TEMP/export/SP500Index.app" \
            "$RUNNER_TEMP/SP500Index.zip"

          # Submit for notarization and capture output
          SUBMISSION_OUTPUT=$(xcrun notarytool submit "$RUNNER_TEMP/SP500Index.zip" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --wait 2>&1) || true

          echo "$SUBMISSION_OUTPUT"

          # Extract submission ID
          SUBMISSION_ID=$(echo "$SUBMISSION_OUTPUT" | grep "id:" | head -1 | awk '{print $2}')
          echo "Submission ID: $SUBMISSION_ID"

          # Check if notarization succeeded
          if echo "$SUBMISSION_OUTPUT" | grep -q "status: Accepted"; then
            echo "Notarization succeeded!"
            xcrun stapler staple "$RUNNER_TEMP/export/SP500Index.app"
          else
            echo "Notarization failed. Fetching log..."
            xcrun notarytool log "$SUBMISSION_ID" \
              --apple-id "$APPLE_ID" \
              --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD"
            exit 1
          fi

      - name: Verify Notarization
        run: |
          spctl --assess --type open --context context:primary-signature --verbose=2 "$RUNNER_TEMP/export/SP500Index.app"

      - name: Create DMG
        run: |
          hdiutil create \
            -volname "SP500Index" \
            -srcfolder "$RUNNER_TEMP/export/SP500Index.app" \
            -ov \
            -format UDZO \
            "$RUNNER_TEMP/SP500Index.dmg"

      - name: Notarize DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          xcrun notarytool submit "$RUNNER_TEMP/SP500Index.dmg" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --wait

          xcrun stapler staple "$RUNNER_TEMP/SP500Index.dmg"

      - name: Generate Appcast
        if: startsWith(github.ref, 'refs/tags/')
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "Missing SPARKLE_PRIVATE_KEY secret"
            exit 1
          fi

          SPARKLE_BIN=$(find ~/Library/Developer/Xcode/DerivedData \
            -path "*/SourcePackages/artifacts/sparkle/Sparkle/bin/generate_appcast" \
            -print -quit 2>/dev/null | xargs -I{} dirname "{}")

          if [ -z "$SPARKLE_BIN" ]; then
            echo "Unable to locate Sparkle tools in DerivedData"
            exit 1
          fi

          RELEASES_DIR="$RUNNER_TEMP/releases"
          KEY_FILE="$RUNNER_TEMP/sparkle_private_key"
          APPCAST_PATH="$RUNNER_TEMP/appcast.xml"

          printf "%s" "$SPARKLE_PRIVATE_KEY" > "$KEY_FILE"
          mkdir -p "$RELEASES_DIR"
          cp "$RUNNER_TEMP/SP500Index.dmg" "$RELEASES_DIR/"

          "$SPARKLE_BIN/generate_appcast" \
            --ed-key-file "$KEY_FILE" \
            --download-url-prefix "https://github.com/slhernandez/SP500Index/releases/download/${{ github.ref_name }}/" \
            "$RELEASES_DIR"

          cp "$RELEASES_DIR/appcast.xml" "$APPCAST_PATH"
          rm -f "$KEY_FILE"

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SP500Index-macOS
          path: ${{ runner.temp }}/SP500Index.dmg

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ runner.temp }}/SP500Index.dmg
          generate_release_notes: true

      - name: Checkout main for appcast
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/checkout@v4
        with:
          ref: main
          path: appcast-main

      - name: Publish appcast
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cp "$RUNNER_TEMP/appcast.xml" appcast-main/appcast.xml
          cd appcast-main

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- appcast.xml; then
            echo "appcast.xml unchanged"
            exit 0
          fi

          git add appcast.xml
          git commit -m "Update appcast.xml for ${{ github.ref_name }}"
          git push origin HEAD:main

      - name: Cleanup Keychain
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
